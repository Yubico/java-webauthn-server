# This name is shown in the status badge in the README
name: build

on:
  push:
    branches-ignore:
      - 'tmp**'
  pull_request:
    branches-ignore:
      - 'tmp**'
  schedule:
    # Run once a week to check compatibility with new versions of dependencies
    - cron: '0 0 * * 1'

jobs:
  test:
    name: JDK ${{ matrix.java }} ${{ matrix.distribution }}

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21, 25]
        distribution: [temurin]
        include:
          - java: 25
            distribution: zulu
          - java: 25
            distribution: microsoft

    outputs:
        report-java: 25
        report-dist: temurin

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 => v7.0.1

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6 => v6.0.1
      with:
        java-version: ${{ matrix.java }}
        distribution: ${{ matrix.distribution }}

    - name: Build and test with JDK ${{ matrix.java }}
      run: ./gradlew clean test

    - name: Build archives
      run: ./gradlew assemble

    - name: Run test using Java 25 runtime
      run: ./gradlew testJava25

    - name: Run test using Java 21 runtime
      run: ./gradlew testJava21

    - name: Run test using Java 17 runtime
      run: ./gradlew testJava17

    - name: Run test using Java 11 runtime
      run: ./gradlew testJava11

    - name: Run test using Java 8 runtime
      run: ./gradlew testJava8

    - name: Archive HTML test reports
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7 => v7.0.1
      with:
        name: test-reports-java${{ matrix.java }}-${{ matrix.distribution }}-html
        path: "*/build/reports/**"

    - name: Archive JUnit test reports
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7 => v7.0.1
      with:
        name: test-reports-java${{ matrix.java }}-${{ matrix.distribution }}-xml
        path: "*/build/test-results/**/*.xml"

    - name: Check binary reproducibility
      run: |
        ./gradlew clean primaryPublishJar
        find . -name '*.jar' | grep -v buildSrc | grep -v gradle-wrapper | xargs sha256sum | tee java-webauthn-server-artifacts-${{ matrix.java }}-${{ matrix.distribution }}.sha256sum
        ./gradlew clean primaryPublishJar && sha256sum -c java-webauthn-server-artifacts-${{ matrix.java }}-${{ matrix.distribution }}.sha256sum
        ./gradlew clean primaryPublishJar && sha256sum -c java-webauthn-server-artifacts-${{ matrix.java }}-${{ matrix.distribution }}.sha256sum

    - name: Archive artifact checksums
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7 => v7.0.1
      with:
        path: java-webauthn-server-artifacts-${{ matrix.java }}-${{ matrix.distribution }}.sha256sum
        archive: false

  publish-test-results:
    name: Publish test results
    needs: test
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' }}

    permissions:
      checks: write
      pull-requests: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8 => v8.0.1
      with:
        name: test-reports-java${{ needs.test.outputs.report-java }}-${{ needs.test.outputs.report-dist }}-xml

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: "**/*.xml"
